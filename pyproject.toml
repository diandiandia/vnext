[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachable-audit-vnext"
version = "0.1.0"
description = "Campaign-scale orchestration core for reachable vulnerability audits"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
reachable-audit = "reachable_audit.cli:main"

[tool.setuptools]
packages = [
    "reachable_audit",
    "reachable_audit.adapters",
    "reachable_audit.adapters.builds",
    "reachable_audit.adapters.languages",
    "reachable_audit.discovery",
    "reachable_audit.experiments",
    "reachable_audit.knowledge_assets",
]
package-dir = {"" = "src", "reachable_audit.knowledge_assets" = "knowledge"}

[tool.setuptools.package-data]
"reachable_audit.discovery" = ["*.go", "*.java"]
"reachable_audit.knowledge_assets" = [
    "portfolio.json",
    "provenance.json",
    "profiles/*.json",
    "cards/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
